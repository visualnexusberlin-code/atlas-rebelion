<title>La Bóveda de Ortega</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Josefin+Sans:wght@300;400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Concepto: un mecanismo Déco luminoso a pantalla completa. Cada tensión del libro reorganiza las mismas piezas en una figura propia; el texto se despliega a su lado en una columna amplia, sobre la noche. */
:root{
  --night:#06090e;       /* fondo */
  --deep:#0c1520;        /* superficie */
  --gold:#f2c879;        /* glow principal, rótulos */
  --brass:#b8924f;       /* filetes */
  --paper:#efe6d2;       /* texto de lectura */
  --muted:#a59a86;       /* texto secundario */
  --line:rgba(242,200,121,.22);
  --o:#f2c879;           /* plano Ortega */
  --a:#7fd8ff;           /* plano hoy */
  --c:#ff8470;           /* plano contrapunto */
  --accent:#f2c879;      /* lo cambia cada tensión */
  --deco:"Poiret One","Josefin Sans",Futura,"Century Gothic",sans-serif;
  --label:"Josefin Sans",Futura,"Avenir Next",system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--serif);overflow:hidden}
#bg{position:fixed;inset:0;background:
  radial-gradient(ellipse 70% 60% at 50% 46%,rgba(242,200,121,.07),transparent 70%),
  repeating-conic-gradient(from 0deg at 50% 46%,rgba(242,200,121,.035) 0 1deg,transparent 1deg 7.5deg),
  radial-gradient(ellipse at 50% 120%,#0d1a26 0,var(--night) 60%);transition:background-position 1.2s}
body.reading #bg{background-position:-22vw 0,-22vw 0,0 0}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#gl:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}

/* Cabecera */
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  background:linear-gradient(var(--night) 30%,transparent)}
.brand{display:flex;flex-direction:column;gap:3px;background:none;border:0;color:inherit;text-align:left;cursor:pointer;padding:0}
.brand b{font-family:var(--deco);font-weight:400;font-size:clamp(1.05rem,1.9vw,1.45rem);letter-spacing:.24em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 18px rgba(242,200,121,.45)}
.brand span{font-family:var(--label);font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.nav button{font-family:var(--label);font-weight:600;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);background:none;border:0;padding:8px 10px;cursor:pointer;border-bottom:1px solid transparent}
.nav button:hover{color:var(--paper)}
.nav button[aria-current="page"]{color:var(--gold);border-bottom-color:var(--gold)}
.uni{display:flex;align-items:center;gap:8px;margin-left:8px;padding-left:12px;border-left:1px solid var(--line)}
.uni label{font-family:var(--label);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.uni input{width:96px;accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* Portal */
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:3;width:min(34rem,calc(100% - 32px));text-align:center;
  font-family:var(--serif);font-style:italic;font-size:1.05rem;line-height:1.5;color:var(--paper);text-shadow:0 2px 14px #000;transition:opacity .6s}
.hint b{font-style:normal;font-weight:600;color:var(--gold)}
body.reading .hint{opacity:0;pointer-events:none}

/* Dial de las seis tensiones */
.dial{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:2px;flex-wrap:wrap;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:18px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:linear-gradient(transparent,var(--night) 55%)}
.dial button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:92px;padding:8px 10px 6px;background:none;border:0;cursor:pointer;color:var(--muted);position:relative}
.dial button i{font-style:normal;font-family:var(--deco);font-size:1.25rem;color:var(--brass);line-height:1}
.dial button span{font-family:var(--label);font-weight:600;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase}
.dial button::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:2px;background:var(--c-acc,var(--gold));opacity:0;transition:opacity .3s;box-shadow:0 0 10px var(--c-acc,var(--gold))}
.dial button:hover{color:var(--paper)}
.dial button[aria-current="true"]{color:var(--paper)}
.dial button[aria-current="true"] i{color:var(--c-acc,var(--gold));text-shadow:0 0 14px var(--c-acc,var(--gold))}
.dial button[aria-current="true"]::after,.dial button.chosen::after{opacity:1}
.dial button.chosen::after{opacity:.45}
.dial .sep{width:1px;background:var(--line);margin:6px 8px}

/* Panel de lectura */
.panel{position:fixed;z-index:4;top:0;bottom:0;right:0;width:min(44rem,56vw);overflow-y:auto;overscroll-behavior:contain;
  padding-top:calc(96px + env(safe-area-inset-top,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));
  padding-left:clamp(24px,4vw,64px);padding-right:max(clamp(20px,3vw,48px),env(safe-area-inset-right,0px));
  background:linear-gradient(90deg,rgba(6,9,14,0) 0,rgba(6,9,14,.82) 9%,rgba(6,9,14,.94) 30%);
  opacity:0;pointer-events:none;transition:opacity .5s}
body.reading .panel{opacity:1;pointer-events:auto}
.panel:focus{outline:none}
.col{max-width:38rem}
.unfold>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.unfold>*:nth-child(2){animation-delay:.08s}.unfold>*:nth-child(3){animation-delay:.16s}.unfold>*:nth-child(4){animation-delay:.24s}
.unfold>*:nth-child(5){animation-delay:.32s}.unfold>*:nth-child(6){animation-delay:.4s}.unfold>*:nth-child(n+7){animation-delay:.48s}
@keyframes rise{from{opacity:0;transform:translateY(18px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
.eyebrow{font-family:var(--label);font-weight:600;font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);margin:0}
.title{font-family:var(--deco);font-weight:400;font-size:clamp(2.1rem,4.2vw,3.5rem);line-height:1.08;letter-spacing:.02em;margin:10px 0 6px;color:var(--paper);text-wrap:balance;
  text-shadow:0 0 28px color-mix(in srgb,var(--accent) 45%,transparent)}
.loc{font-family:var(--label);font-size:.72rem;letter-spacing:.12em;color:var(--muted);font-variant-numeric:tabular-nums}
.rule{display:flex;align-items:center;gap:10px;margin:22px 0 18px;color:var(--accent)}
.rule::before,.rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,currentColor,transparent);opacity:.6}
.rule svg{width:34px;height:14px}
section.block{margin:0 0 30px}
.block h3{font-family:var(--label);font-weight:600;font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.block h3 .gem{width:11px;height:11px;transform:rotate(45deg);flex:none;box-shadow:0 0 10px currentColor;background:currentColor}
.ortega h3{color:var(--o)} .hoy h3{color:var(--a)} .contra h3{color:var(--c)}
.big{font-family:var(--serif);font-size:clamp(1.3rem,2vw,1.6rem);line-height:1.38;margin:0 0 14px;text-wrap:pretty}
.block p{font-size:1.06rem;line-height:1.65;margin:0 0 12px}
blockquote{margin:14px 0;padding:2px 0 2px 18px;border-left:2px solid var(--o);font-style:italic;font-size:1.06rem;line-height:1.55;color:#f5ead2}
blockquote cite{display:block;font-style:normal;font-family:var(--label);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 10px}
.door{position:relative;text-align:left;cursor:pointer;color:var(--paper);background:rgba(12,21,32,.7);border:1px solid var(--line);padding:22px 18px 18px;min-height:132px;
  clip-path:polygon(0 14px,14px 14px,14px 0,calc(100% - 14px) 0,calc(100% - 14px) 14px,100% 14px,100% 100%,0 100%);transition:border-color .3s,background .3s,box-shadow .3s}
.door i{display:block;font-style:normal;font-family:var(--deco);font-size:1.6rem;color:var(--a);margin-bottom:8px;text-shadow:0 0 12px rgba(127,216,255,.5)}
.door b{display:block;font-weight:400;font-size:1.12rem;line-height:1.35}
.door:hover{border-color:rgba(127,216,255,.55)}
.door[aria-pressed="true"]{border-color:var(--a);background:rgba(127,216,255,.1);box-shadow:inset 0 0 40px rgba(127,216,255,.12)}
.door:disabled{opacity:.45;cursor:not-allowed}
.reading{border:1px solid rgba(127,216,255,.3);padding:18px;margin-top:6px;background:rgba(12,21,32,.55)}
.reading dl{margin:0;display:grid;gap:14px}
.reading dt{font-family:var(--label);font-weight:600;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--a)}
.reading dt.k2{color:var(--brass)} .reading dt.k3{color:var(--c)}
.reading dd{margin:4px 0 0;font-size:1.02rem;line-height:1.6}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;font-family:var(--label);font-size:.72rem;letter-spacing:.06em;color:var(--muted)}
.chain span{padding:3px 8px;border:1px solid var(--line);color:var(--paper)}
.choose-hint{font-size:.9rem;color:var(--muted);font-style:italic;margin:4px 0 0}
.carry{position:relative;padding:22px 22px 20px;border:1px solid var(--accent);background:radial-gradient(ellipse at 0 0,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%)}
.carry::before{content:"";position:absolute;inset:5px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);pointer-events:none}
.carry .q{font-family:var(--deco);font-size:clamp(1.45rem,2.4vw,1.9rem);line-height:1.25;margin:8px 0 10px;color:var(--paper)}
.carry p.ex{font-style:italic;color:#cfc4ad;margin:0;font-size:1rem;line-height:1.5}
.notice{border:1px solid var(--gold);background:rgba(242,200,121,.08);padding:12px 14px;margin:0 0 20px;font-family:var(--label);font-size:.8rem;line-height:1.5;letter-spacing:.03em}
.notice button{margin-top:8px;display:block}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.btn{font-family:var(--label);font-weight:600;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);background:none;border:1px solid rgba(242,200,121,.5);padding:11px 14px;cursor:pointer}
.btn:hover{background:rgba(242,200,121,.1)}
.btn.solid{background:var(--gold);color:var(--night);border-color:var(--gold)}
details.src{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
details.src summary{cursor:pointer;font-family:var(--label);font-weight:600;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);padding:6px 0}
.chap{padding:14px 0;border-bottom:1px solid rgba(242,200,121,.1)}
.chap h4{margin:0 0 4px;font-family:var(--label);font-weight:600;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--paper)}
.chap p{font-size:1rem;line-height:1.6;margin:8px 0}
.chap ol{margin:6px 0 0;padding-left:1.3em;font-size:.95rem;line-height:1.55}
.minute{list-style:none;margin:0;padding:0;counter-reset:m;display:grid;gap:16px}
.minute li{counter-increment:m;display:grid;grid-template-columns:2.2rem 1fr;gap:12px;font-size:1.12rem;line-height:1.55}
.minute li::before{content:counter(m,upper-roman);font-family:var(--deco);font-size:1.3rem;color:var(--gold);text-shadow:0 0 10px rgba(242,200,121,.5)}
.ledger{display:grid;gap:12px;margin:14px 0}
.ledger div{padding:12px 14px;border-left:2px solid var(--a);background:rgba(12,21,32,.6)}
.ledger b{font-family:var(--label);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--a);font-weight:600}
.ledger p{margin:4px 0 0;font-size:.98rem;line-height:1.5}
.qs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.qs li{display:grid;grid-template-columns:2.2rem 1fr;gap:10px;font-size:1.08rem;line-height:1.45}
.qs li i{font-style:normal;font-family:var(--deco);color:var(--accent)}
.note{font-family:var(--label);font-size:.74rem;line-height:1.6;letter-spacing:.03em;color:var(--muted);margin-top:20px}
.caption{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(92px + env(safe-area-inset-top,0px));width:min(32rem,calc(100% - 32px));text-align:center;
  font-family:var(--label);font-size:.78rem;letter-spacing:.06em;line-height:1.5;color:var(--paper);background:rgba(6,9,14,.82);border:1px solid var(--line);padding:9px 12px;opacity:0;transition:opacity .5s;pointer-events:none}
.caption.show{opacity:1}
.tip{position:fixed;z-index:6;pointer-events:none;font-family:var(--label);font-weight:600;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--paper);background:rgba(6,9,14,.9);border:1px solid var(--line);padding:6px 9px;transform:translate(14px,14px);white-space:nowrap}
.short{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:899px){
  .top{gap:4px;padding-bottom:4px}
  .brand span{display:none}
  .brand b{font-size:.95rem;letter-spacing:.18em}
  .nav{width:100%;justify-content:space-between;flex-wrap:nowrap}
  .nav nav{display:flex}
  .long{display:none}.short{display:inline}
  .nav button{padding:6px 7px;font-size:.6rem;letter-spacing:.14em}
  .uni{margin-left:0;padding-left:8px}
  .uni label{display:none}.uni input{width:70px}
  .panel{width:100%;top:38%;padding-top:28px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
    background:linear-gradient(rgba(6,9,14,0) 0,rgba(6,9,14,.92) 26px,rgba(6,9,14,.97) 100%)}
  .title{font-size:2rem}
  .doors{grid-template-columns:1fr}
  .door{min-height:0}
  .dial button{min-width:0;padding:6px 6px 5px}
  .dial button span{display:none}
  .dial button i{font-size:1.1rem}
  .hint{bottom:calc(70px + env(safe-area-inset-bottom,0px));font-size:.95rem}
  body.reading #bg{background-position:0 -18vh,0 -18vh,0 0}
}
@media (prefers-reduced-motion:reduce){.unfold>*{animation:none}#bg,.panel,.hint{transition:none}}
</style>

<div id="bg" aria-hidden="true"></div>
<canvas id="gl" tabindex="0" aria-label="Mecanismo de la bóveda. Seis sectores, uno por cada tensión del libro. Flechas para recorrerlos, Intro para entrar."></canvas>

<header class="top">
  <button class="brand" type="button" id="home"><b>La rebelión de las masas</b><span>José Ortega y Gasset · 1930 · Bóveda</span></button>
  <div class="nav">
    <nav aria-label="Secciones">
      <button type="button" data-go="portal">Bóveda</button>
      <button type="button" data-go="minuto"><span class="long">El libro en un minuto</span><span class="short">Un minuto</span></button>
      <button type="button" data-go="centro"><span class="long">El centro</span><span class="short">Centro</span></button>
      <button type="button" data-go="obra"><span class="long">La obra</span><span class="short">Obra</span></button>
    </nav>
    <div class="uni"><label for="uni">Uniformar</label><input id="uni" type="range" min="0" max="100" value="0" aria-describedby="uniHelp"><span id="uniHelp" class="sr">Experimento: al uniformar, los colores y el propio texto pierden sus diferencias.</span></div>
  </div>
</header>

<p class="hint" id="hint"><b>Seis tensiones de un libro de 1930 que siguen abiertas.</b><br>Toca un sector de la bóveda. Cada uno reorganiza el mecanismo y despliega una pregunta.</p>
<div class="tip" id="tip" hidden></div>
<p class="caption" id="caption" role="status"></p>

<article class="panel" id="panel" tabindex="-1" aria-live="polite"><div class="col" id="col"></div></article>

  const acc=S.view==="t"?T[S.n].acento:"#f2c879"; document.documentElement.style.setProperty("--accent",acc);
  if(S.view!=="portal"){col.className="col unfold";col.innerHTML=S.view==="t"?tension(S.n):S.view==="minuto"?minuto():S.view==="centro"?centro():obra();
    wire(); panel.scrollTop=0;}
  drawDial();
  Mech&&Mech.form(S.view==="t"?T[S.n].figura:S.view,acc);
  Mech&&Mech.setCore(S.visited.size/6, S.view==="t"?S.n:-1);
}
function wire(){
  col.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>go("t",+b.dataset.t));
  col.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  col.querySelectorAll("[data-restore]").forEach(b=>b.onclick=restore);
  col.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{S.choices.set(S.n,+b.dataset.choice);const top=panel.scrollTop;col.className="col";col.innerHTML=tension(S.n);wire();panel.scrollTop=top;drawDial();
    Mech&&Mech.pulse(+b.dataset.choice);say("La lectura elegida ilumina una parte del mecanismo y deja otra en sombra.")});
  const cp=col.querySelector("#copy"); if(cp)cp.onclick=()=>{const txt="Seis preguntas para pensar hoy · a partir de Ortega y Gasset, La rebelión de las masas\n\n"+T.map((t,i)=>`${NUM[i]}. ${t.herramienta}`).join("\n");
    const note=$("#copyNote"),fb=()=>{const r=document.createRange();r.selectNodeContents($("#qs"));const s=getSelection();s.removeAllRanges();s.addRange(r);note.textContent="Ya están seleccionadas: cópialas con el teclado."};
    try{navigator.clipboard.writeText(txt).then(()=>note.textContent="Copiadas.",fb)}catch(e){fb()}};
}
function go(view,n=null){S.view=view;S.n=n;render();try{history.replaceState(null,"",view==="portal"?location.pathname:"#"+(view==="t"?T[n].id:view))}catch(e){}
  if(view!=="portal")panel.focus({preventScroll:true})}
function restore(){S.u=0;$("#uni").value=0;Mech&&Mech.setUniform(0);if(S.view!=="portal"){const top=panel.scrollTop;col.className="col";col.innerHTML=S.view==="t"?tension(S.n):col.innerHTML;wire();panel.scrollTop=top}say("Los matices vuelven: colores, lecturas y objeciones.")}
$("#home").onclick=()=>go("portal");
document.querySelectorAll(".nav [data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.view!=="portal")go("portal")});
$("#uni").addEventListener("input",()=>{const before=band();S.u=+$("#uni").value/100;Mech&&Mech.setUniform(S.u);

  canvas.addEventListener("pointermove",e=>{hover=hit(e);canvas.style.cursor=hover>=0?"pointer":"default";
    if(hover>=0&&e.pointerType==="mouse"){tip.hidden=false;tip.style.left=e.clientX+"px";tip.style.top=e.clientY+"px";tip.textContent=`${NUM[hover]} · ${T[hover].titulo}`}else tip.hidden=true});
  canvas.addEventListener("pointerleave",()=>{hover=-1;tip.hidden=true});
  let down=null;canvas.addEventListener("pointerdown",e=>down={x:e.clientX,y:e.clientY});
  canvas.addEventListener("pointerup",e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)return;const n=hit(e);if(n>=0){tip.hidden=true;go("t",n)}});
  let kb=0;canvas.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();kb=(kb+(e.key==="ArrowRight"?1:5))%6;hover=kb;say(`${NUM[kb]} · ${T[kb].titulo}`,1800)}if(e.key==="Enter")go("t",kb)});
  const par={x:0,y:0,tx:0,ty:0};addEventListener("pointermove",e=>{par.tx=e.clientX/innerWidth-.5;par.ty=e.clientY/innerHeight-.5});

  const tmpC=new THREE.Color(), mono=new THREE.Color("#e9d7a8");
  let last=performance.now(), run=true;
  document.addEventListener("visibilitychange",()=>{run=!document.hidden;if(run){last=performance.now();requestAnimationFrame(loop)}});
  function loop(now){if(!run)return;const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
    fit(); const k=reduce?1:Math.min(1,dt*3); lay.x+=(layout.x-lay.x)*k;lay.y+=(layout.y-lay.y)*k;lay.s+=(layout.s-lay.s)*k;
    rig.position.set(lay.x,lay.y,0);
    const el=(now-fStart)/1000;
    const rk=reduce?1:ease(Math.min(1,el/1.6));
    rig.rotation.set(rigFrom.x+(rigTo.x-rigFrom.x)*rk+(reduce?0:-par.ty*.12),rigFrom.y+(rigTo.y-rigFrom.y)*rk+(reduce?0:par.tx*.18),0);
    rig.scale.setScalar(lay.s);
    E.forEach(e=>{const p=reduce?1:ease(Math.max(0,Math.min(1,(el-e.dl)/DUR)));const o=e.o;
      o.position.lerpVectors(e.from.p,e.to.p,p);o.scale.lerpVectors(e.from.s,e.to.s,p);
      o.rotation.set(e.from.r.x+(e.to.r.x-e.from.r.x)*p,e.from.r.y+(e.to.r.y-e.from.r.y)*p,e.from.r.z+(e.to.r.z-e.from.r.z)*p);
      if(e.sp){e.spin+=(e.spinT-e.spin)*Math.min(1,dt*2);if(!reduce)e.sp.rotation.z+=e.spin*dt}});
    if(!reduce){rays.forEach((r,i)=>{if(form==="portal"||form==="centro"||form==="armilar"||form==="mosaico")r.o.rotation.z+=dt*(form==="centro"?.25:.05)})}
    // teselas: pluralidad ↔ uniformidad
    tiles.forEach(e=>{tmpC.copy(e.base).lerp(mono,uni);e.o.material.color.copy(tmpC).multiplyScalar(1.05+(reduce?0:Math.sin(t*1.6+e.i)*.15))});
    // sectores
    segs.forEach(s=>{const on=s.i===hover;s.body.material.color.set(on?"#5a4426":"#2a2116");s.out.material.color.set(T[s.i].acento).lerp(mono,uni).multiplyScalar(on?2.2:.95);s.lab.scale.setScalar(on?1.08:1);
      if(!reduce&&form==="portal")s.o.position.z=on?.25:0});
    // núcleo
    pulseT=Math.max(0,pulseT-dt*1.5);
    const cs=(F[form].core||1)*(1+coreNow*.6)+pulseT*.8+(reduce?0:Math.sin(t*2.2)*.05);
    core.scale.setScalar(cs);coreHalo.scale.setScalar(cs*(1.3+(reduce?0:Math.sin(t*1.3)*.08)));pl.intensity=.6+cs*.6;
    core.material.color.set("#ffe2a6").multiplyScalar(1.2+coreNow*1.0+pulseT*2);
    if(bloom)bloom.strength=.78+pulseT*.6+(form==="centro"?.3:0);
    camera.position.set(par.x*.0,0,dist);camera.lookAt(0,0,0);
    composer?composer.render():renderer.render(scene,camera);
    requestAnimationFrame(loop)}
  requestAnimationFrame(loop);
  document.fonts&&document.fonts.ready.then(()=>labelDraw.forEach(f=>f()));
})();

/* ---------- Arranque ---------- */
(function(){const h=(location.hash||"").slice(1);const i=T.findIndex(t=>t.id===h);
  if(i>=0)go("t",i);else if(["minuto","centro","obra"].includes(h))go(h);else render()})();
</script>
