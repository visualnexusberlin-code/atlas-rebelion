:root{

.seclabel{position:absolute;left:0;top:0;translate:-50% -50%;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;cursor:pointer;padding:6px 8px;min-width:44px;min-height:44px;color:var(--paper);will-change:transform}

.dial{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:2px;flex-wrap:wrap;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:18px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));

.dial button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:92px;min-height:48px;padding:8px 10px 6px;background:none;border:0;cursor:pointer;color:var(--muted);position:relative}

.panel{position:fixed;z-index:4;top:0;bottom:0;right:0;width:min(44rem,56vw);overflow-y:auto;overscroll-behavior:contain;

    const du=deco.material.uniforms,inPortal=S.view==="portal"?1:0;du.uC.value.set(lay.x,lay.y);du.uS.value=lay.s;du.uT.value=t;du.uUni.value=uni;du.uAcc.value.lerp(acc,reduce?1:Math.min(1,dt*2));du.uPortal.value+=(inPortal-du.uPortal.value)*(reduce?1:Math.min(1,dt*2.5));
    if(inPortal){rig.updateMatrixWorld();segs.forEach((s,i)=>{labV.set(3.72*Math.cos(s.c),3.72*Math.sin(s.c),.3).applyMatrix4(s.o.matrixWorld).project(camera);
      labs[i].style.transform=`translate(${((labV.x+1)/2*innerWidth).toFixed(1)}px,${((1-labV.y)/2*innerHeight).toFixed(1)}px)`})}
    composer?composer.render():renderer.render(scene,camera);
    requestAnimationFrame(loop)}
  requestAnimationFrame(loop);
  // Gancho de pruebas: medidas en escena
  window.__b={build:BUILD,form:()=>form,info:()=>({calls:renderer.info.render.calls,tris:renderer.info.render.triangles,programs:renderer.info.programs.length,bloom:!!composer}),
    labels:()=>labs.map(b=>{const r=b.getBoundingClientRect(),sp=b.querySelector("span");return {t:sp.textContent,x:Math.round(r.left),y:Math.round(r.top),w:Math.round(r.width),h:Math.round(r.height),px:parseFloat(getComputedStyle(sp).fontSize)}})};
})();

/* ---------- Momentos clave en vídeo (Remotion) ---------- */
const FILMS={prologo:"media/prologo.mp4",uniformar:"media/uniformar.mp4",centro:"media/centro.mp4"}, shownFilms=new Set();
function playFilm(k){
  let seen=shownFilms.has(k); try{seen=seen||sessionStorage.getItem("boveda-film-"+k)==="1"}catch(e){}
  if(reduce||seen)return; shownFilms.add(k); try{sessionStorage.setItem("boveda-film-"+k,"1")}catch(e){}
  const f=$("#film"),v=$("#filmVideo"),back=document.activeElement; let done=false;
  const end=()=>{if(done)return;done=true;f.classList.remove("show");document.removeEventListener("keydown",key,true);
    setTimeout(()=>{f.hidden=true;v.pause();v.removeAttribute("src");v.load()},600);if(back&&back.focus)back.focus({preventScroll:true})};
  const key=e=>{if(e.key==="Escape"){e.stopPropagation();end()}};
  v.src=FILMS[k];v.poster="media/"+k+".jpg";f.hidden=false;requestAnimationFrame(()=>f.classList.add("show"));
  v.onended=end;v.onerror=end;$("#filmSkip").onclick=end;document.addEventListener("keydown",key,true);
  const pr=v.play();if(pr&&pr.catch)pr.catch(end);$("#filmSkip").focus({preventScroll:true});
}

  if(i>=0)go("t",i);else if(["minuto","centro","obra"].includes(h))go(h);else{render();playFilm("prologo")}})();
